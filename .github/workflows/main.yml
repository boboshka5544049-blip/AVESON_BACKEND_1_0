name: AVESON BACKEND 1.0 CHECK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find Backend ZIP
        run: |
          ZIP_FILE="AVESON_BACKEND_1_0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Backend ZIP topilmadi: $ZIP_FILE"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf backend_project
          mkdir -p backend_project

          unzip -o "$ZIP_FILE" -d backend_project

      - name: Locate Backend project
        run: |
          PACKAGE=$(find backend_project -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json topilmadi."
            find backend_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Check JavaScript syntax
        run: |
          find "$PROJECT_DIR/src" -name "*.js" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Backend check complete
        run: |
          echo "AVESON BACKEND 1.0 CHECK PASSED"
